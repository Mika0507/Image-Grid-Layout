<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <ul>
        <li>
          Home
          <div class="description">
            <p>
              Click on the links to explore different sections of the website.
            </p>
          </div>
        </li>
        <li class="li2">
          Projects
          <div class="description2">
            <p>Discover our latest projects and case studies.</p>
          </div>
        </li>
        <li class="li3">
          Blog
          <div class="description3">
            <p>Read our latest articles and insights.</p>
          </div>
        </li>
      </ul>
    </header>
    <main class="image-grid">
      <img
        src="/images/pexels-alex-koval-1650789389-34075602.jpg"
        alt="architectural design"
      />
      <img
        src="/images/pexels-krzysztof-kasek-2161324657-37645157.jpg"
        alt="food photography"
      />
      <img
        src="/images/pexels-daniel-szabat-259816403-35097337.jpg"
        alt="nature landscape"
      />
      <img
        src="/images/pexels-hleb-rahoisha-79787240-8720817.jpg"
        alt="city skyline"
      />
      <img src="/images/pexels-hvitkerist-35829198.jpg" alt="abstract art" />
      <img
        src="/images/pexels-james-bond-756164766-19975110.jpg"
        alt="travel destination"
      />
    </main>
  </body>
</html>
